name: CI and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run tests, build mod, and execute Forge GameTests
        run: ./gradlew --no-daemon clean test build runGameTestServer
      - name: Test offline research tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify release tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME must match mod_version ($version)."
            exit 1
          }
      - name: Package release JARs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: neurolab-mc-mod-jar
          path: |
            build/libs/neurolab-mc-1.21.1-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
